# RL² direction target reward environment configuration

# General environment configuration
# ----------
# Number of tasks for meta-training
train_tasks: 2

# Number of tasks for meta-testing
test_tasks: 2

# Number of hidden unit dimensions
hidden_dim: 64

# RL² environment configuration
# ------------
rl2_params:
    # Number of iterations for training
    num_iterations: 1000
    # Number of samples to collect during training
    num_samples: 800
    # Maximum number of steps for the environment
    max_step: 200
    # Number of task samples for training
    meta_batch_size: 4
    # Number of early stopping conditions
    num_stop_conditions: 3
    # Target value used in early stopping conditions
    stop_goal: 180

# PPO environment configuration
# -----------
ppo_params:
    # Discount factor
    gamma: 0.99
    # Number of epochs to take per iteration
    num_epochs: 10
    # Number of mini-batches to take in each epoch
    mini_batch_size: 32
    # Parameter for clipping
    clip_param: 0.3
    # Learning rate
    learning_rate: 0.0001
