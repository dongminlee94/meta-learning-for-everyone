# MAML direction target reward environment settings

# General environment settings
# ----------
# Number of tasks for meta-training
train_tasks: 2

# Number of tasks for meta-testing
test_tasks: 2

# Number of hidden units used in policy network
policy_hidden_dim: 64

# Number of hidden units used in policy network
value_function_hidden_dim: 32

# MAML environment settings
# ------------
maml_params:
    # Number of iterations for training
    num_iterations: 1000
    # Number of task samples for training
    meta_batch_size: 40
    # Number of samples to collect per task
    num_samples: 2000
    # Maximum number of steps for environment
    max_steps: 200
    # Number of inner loop adaptation epochs
    num_adapt_epochs: 1
    # Learning rate for inner loop adaptation
    inner_learning_rate: 0.1
    # Number of early stopping conditions
    num_stop_conditions: 3
    # Target value used in early stopping condition
    stop_goal: 400
    # Maximum number of iterations for backtracking line search
    backtrack_iters: 15
    # Exponentially decreasing ratio in line search step
    backtrack_coeff: 0.8
    # Limit value of KL-divergence
    max_kl: 0.01

# PG environment settings
# ----------
pg_params:
    # Learning rate of value function as baseline fitting
    vf_learning_rate: 0.1
    # Number of iterations of value function as baseline fitting
    vf_learning_iters: 1
    # Discount rate
    gamma: 0.99
    # GAE parameter
    lamda: 1.0
