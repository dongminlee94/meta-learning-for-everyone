# PEARL velocity target reward environment settings

# General environment settings
# ----------
# Number of tasks for meta-training
train_tasks: 100

# Number of tasks for meta-testing
test_tasks: 30

# Number of dimensions of latent context
latent_dim: 5

# Number of dimensions of hidden units
hidden_dim: 300

# PEARL environment settings
# -------------
pearl_params:
    # Number of iterations for training
    num_iterations: 1000
    # Number of sampled tasks to collect per iteration
    num_sample_tasks: 5
    # Number of samples collected per task before training
    num_init_samples: 2000
    # Number of samples to collect per task when using z ~ prior
    num_prior_samples: 400
    # Number of samples to collect per task when using z ~ posterior
    # Used only for policy network training, not for encoder
    num_posterior_samples: 600
    # Number of meta-gradients to take per iteration
    num_meta_grads: 1500
    # Sample size of meta-batch
    meta_batch_size: 16
    # Sample size of context batch
    batch_size: 100
    # Maximum number of steps for environment
    max_step: 200
    # Maximum buffer size
    max_buffer_size: 1000000
    # Number of early stopping conditions
    num_stop_conditions: 3
    # Target value used in early stopping condition
    stop_goal: 20

# SAC environment settings
# -----------
sac_params:
    # Discount factor
    gamma: 0.99
    # Weight value for KL divergence used in encoder loss function
    kl_lambda: 0.1
    # Number of samples used in batch for policy and value networks
    batch_size: 256
    # Learning rate for action-value function network
    qf_lr: 0.0003
    # Learning rate for encoder network
    encoder_lr: 0.0003
    # Learning rate for policy network
    policy_lr: 0.0003
